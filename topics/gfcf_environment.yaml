  base_url: https://api.deepseek.com/v1
  prompt_template: 'You are a research assistant specializing in industrial ecology, environmental economics, and input-output
    analysis.


    ## Research Topic


    Topic: {topic_name}

    {topic_description}


    ## Relevance Criteria


    A paper is RELEVANT if it:

    - Studies environmental impacts (carbon, water, material, land, biodiversity, energy) of capital formation, investment,
    or fixed assets

    - Uses MRIO/EEIO methods to analyze investment-related emissions or resource use

    - Examines lifecycle environmental impacts of infrastructure, buildings, machinery, or capital stock

    - Analyzes embodied emissions in capital goods trade

    - Studies decarbonization pathways related to capital investment

    - Quantifies environmental footprint of GDP components related to investment

    - Compares capital formation environmental impacts across countries or development stages

    - Uses structural decomposition analysis (SDA) on capital-related factors


    A paper is NOT RELEVANT if it:

    - Uses "investment" only in financial/portfolio sense (stocks, bonds, ESG investing)

    - Uses "capital" only in human/social/natural capital (not manufactured capital)

    - Uses "carbon" only in chemistry, biology, or atmospheric science

    - Is about biological "investment in offspring" or ecological "capital"

    - Is purely about operational emissions (not embodied/capital-related)

    - Uses MRIO/EEIO but not for capital/investment analysis

    - Is about cement/concrete chemistry, not building lifecycle impacts


    ## Examples


    RELEVANT: "Environmental Impacts of Capital Formation" (Sodersten et al., JIE, 2018) - Studies GFCF structure and carbon
    footprint using MRIO. Compares across countries.

    RELEVANT: "The legacy environmental footprints of manufactured capital" (Wang et al., PNAS, 2023) - Quantifies long-term
    environmental footprint of capital accumulation using supply chain data.

    RELEVANT: "Carbon emissions embodied in investment" (Liang et al., Applied Energy, 2024) - Uses MRIO to quantify embodied
    carbon in investment and allocate emission responsibility.

    NOT RELEVANT: "Early-life adversity shapes growth and reproduction..." - Uses "investment" in biological sense (offspring),
    not capital formation.

    NOT RELEVANT: "Precision indole skeletal editing for single-carbon replacement" - Uses "carbon" in chemistry context,
    not environmental footprint.


    ## Paper to Evaluate


    Title: {title}

    Abstract: {abstract}

    Journal: {journal}

    Year: {year}


    ## Output Format


    Respond in JSON:

    {{"relevant": true/false, "confidence": "high"/"medium"/"low", "reason": "one sentence", "methodology": "MRIO/EEIO/LCA/SDA/IO/none",
    "research_object": "GFCF/capital_stock/investment/infrastructure/none", "environmental_dimension": "carbon/water/material/land/energy/none"}}'
