      - capital_stock_terms
    - environmental_impact
  keyword_sets:
  - investment_terms
  - capital_stock_terms
  - environmental_impact
- name: GFCF x MRIO/EEIO
  priority: 2
  hard_threshold:
    required_sets:
    - - investment_terms
      - capital_stock_terms
    - mrio_eeio
  keyword_sets:
  - investment_terms
  - capital_stock_terms
  - mrio_eeio
- name: GFCF x Trade/Globalization/Inequality
