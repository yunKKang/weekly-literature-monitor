name: Weekly Literature Monitor

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Initial lookback in days (existing checkpoint takes precedence)'
        default: '7'
        type: string
      reprocess_since:
        description: 'Optional YYYY-MM-DD; reapply current rules without republishing DOIs'
        default: ''
        type: string
      include_supplementary:
        description: 'Include monthly supplementary journals now'
        default: false
        type: boolean
      dry_run:
        description: 'Rules-only preview; no AI charges, Issues or state changes'
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-literature-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      DAYS_BACK: ${{ inputs.days_back || '7' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      REPROCESS_SINCE: ${{ inputs.reprocess_since || '' }}
      INCLUDE_SUPPLEMENTARY: ${{ inputs.include_supplementary || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e .
      - name: Verify AI connectivity
        if: ${{ !inputs.dry_run }}
        run: python src/weekly_monitor.py --check-ai
      - name: Run weekly monitor
        run: |
          if ! [[ "$DAYS_BACK" =~ ^[0-9]+$ ]]; then
            echo 'days_back must be a nonnegative integer' >&2
            exit 2
          fi
          args=(--days "$DAYS_BACK" --quiet)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$REPROCESS_SINCE" ]; then args+=(--reprocess-since "$REPROCESS_SINCE"); fi
          if [ "$INCLUDE_SUPPLEMENTARY" = "true" ]; then args+=(--include-supplementary); fi
          python src/weekly_monitor.py "${args[@]}"
      - name: Persist review queue and successful checkpoint
        if: ${{ always() && !cancelled() && !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- state/monitor_state.json
          if [ -f state/review_cache.json ]; then git add -- state/review_cache.json; fi
          if ! git diff --staged --quiet; then
            git commit -m "Persist literature review queue and checkpoint"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
