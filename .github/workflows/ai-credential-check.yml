name: Validate review recovery
on:
  push:
    branches: [fix/unified-ai-review-iam-scope]
    paths: [.github/workflows/ai-credential-check.yml]
permissions:
  contents: read
  issues: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]'
      - name: Verify actual journal identities
        run: python scripts/validate_journals.py --live
      - name: Live Crossref recovery preview without mutation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          before="$(sha256sum state/monitor_state.json)"
          python src/weekly_monitor.py --reprocess-since 2026-07-25 --include-supplementary --dry-run --quiet
          after="$(sha256sum state/monitor_state.json)"
          test "$before" = "$after"
          test ! -f state/review_cache.json
      - name: Verify AI credentials with the fixed production code
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python src/weekly_monitor.py --check-ai
