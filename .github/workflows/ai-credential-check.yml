name: AI credential verification
on:
  push:
    branches: [fix/unified-ai-review-iam-scope]
    paths: [.github/workflows/ai-credential-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - name: Verify configured DeepSeek credential and current model
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys, json, httpx
          key = os.environ.get("DEEPSEEK_API_KEY")
          if not key:
              print("AI_CREDENTIAL_MISSING: configure repository secret DEEPSEEK_API_KEY")
              sys.exit(2)
          response = httpx.post("https://api.deepseek.com/v1/chat/completions", headers={"Authorization": "Bearer "+key}, json={"model":"deepseek-flash","messages":[{"role":"user","content":'Return JSON: {"ok": true}'}],"response_format":{"type":"json_object"},"thinking":{"type":"disabled"},"max_tokens":50}, timeout=60)
          print("AI_HTTP_STATUS:", response.status_code)
          response.raise_for_status()
          result = json.loads(response.json()["choices"][0]["message"]["content"])
          assert result.get("ok") is True
          print("AI_LIVE_CHECK_PASSED")
          PY
