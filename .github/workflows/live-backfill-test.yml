name: Temporary live backfill verification
on:
  push:
    paths:
      - .github/workflows/live-backfill-test.yml
permissions:
  contents: write
  issues: write
concurrency:
  group: weekly-literature-monitor
  cancel-in-progress: false
jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Verify AI and run safe backfill
        run: |
          set +e
          python src/weekly_monitor.py --check-ai
          check_rc=$?
          if [ "$check_rc" -eq 0 ]; then
            python src/weekly_monitor.py --reprocess-since 2026-07-25 --include-supplementary --quiet
            run_rc=$?
          else
            run_rc=$check_rc
          fi
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- state/monitor_state.json
          if [ -f state/review_cache.json ]; then git add -- state/review_cache.json; fi
          if ! git diff --staged --quiet; then
            git commit -m 'Persist live literature backfill result'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          exit "$run_rc"
